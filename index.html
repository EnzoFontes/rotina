    <title>Rotina</title>
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('rotina-theme') || 'null')
          var mode = (saved && saved.mode) || 'system'
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#111318' : (saved ? saved.base : '#4338ca'))
          if (saved) root.style.setProperty('--accent', dark ? saved.bright : saved.base)
        } catch (e) {}
      })()
    </script>
